name: Django CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/taste_mender_db"
  DJANGO_SECRET_KEY: "unit-tests"
  DJANGO_DEBUG: "True"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taste_mender_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14.6
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.6"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report
          coverage xml -o coverage.xml
          coverage html

      - name: Upload HTML coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/cover_html/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          fail_ci_if_error: true
          verbose: true