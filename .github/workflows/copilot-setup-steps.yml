name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taste_mender_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-test.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Enable pg_trgm extension
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d taste_mender_db -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run Django migrations
        working-directory: backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/taste_mender_db"
          DJANGO_SECRET_KEY: "copilot-setup"
          DJANGO_DEBUG: "True"
        run: python manage.py migrate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
