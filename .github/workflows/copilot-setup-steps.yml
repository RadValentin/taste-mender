name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    env:
      AB_SAMPLE_ROOT: ${{ github.workspace }}/.cache/acousticbrainz/sample
      DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/taste_mender_db"
      DJANGO_SECRET_KEY: "copilot-setup"
      DJANGO_DEBUG: "True"
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taste_mender_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.13.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-test.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Cache AcousticBrainz sample archive
        uses: actions/cache@v4
        with:
          path: ${{ env.AB_SAMPLE_ROOT }}
          key: acousticbrainz-sample-20220623-v1

      - name: Download AcousticBrainz sample archive
        run: |
          mkdir -p "${AB_SAMPLE_ROOT}"
          FILE="${AB_SAMPLE_ROOT}/acousticbrainz-highlevel-sample-json-20220623-0.tar.zst"
          if [ ! -f "${FILE}" ]; then
            curl -fL --retry 3 --retry-delay 5 \
              -o "${FILE}" \
              "https://data.metabrainz.org/pub/musicbrainz/acousticbrainz/dumps/acousticbrainz-sample-json-20220623/acousticbrainz-highlevel-sample-json-20220623-0.tar.zst"
          fi

      - name: Enable pg_trgm extension
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d taste_mender_db -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: Run Django migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Build database from sample ingest
        working-directory: backend
        run: python manage.py build_db --sample --limit 1000

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
