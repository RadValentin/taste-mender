services:
  web:
    container_name: taste-mender-web
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    # Load environment variables from a file instead of hardcoding here
    env_file:
      - .env  # path is relative to this compose file (backend/.env)
    restart: unless-stopped  # Auto-restart on failure
    environment:
      #DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      #CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,http://0.0.0.0:8000,http://0.0.0.0:5173"